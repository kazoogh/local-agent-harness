<svg width="1000" height="800" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="1000" height="800"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-800)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="1000" height="800" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="20" y="770" style="font-family: Helvetica-Bold; font-size: 20px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,1540) scale(1,-1)">Local Study Assistant - F3: Background job lifecycle</text>
			<text x="20" y="745" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1490) scale(1,-1)">Goal: Help students keep notes and make study materials on their own computer for free.</text>
			<text x="20" y="720" style="font-family: Helvetica; font-size: 14px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1440) scale(1,-1)">Boxes = persistent StudyJob states. Arrows = allowed transitions with trigger labels.</text>
			<text x="20" y="701" style="font-family: Helvetica; font-size: 14px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1402) scale(1,-1)">Red arrows = failure transitions. Terminal states never resume; Retry creates a new job ID.</text>
			<text x="20" y="682" style="font-family: Helvetica; font-size: 14px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1364) scale(1,-1)">Each publication checks library/settings revisions and cancellation in its final transaction.</text>
			<rect x="80" y="520" width="330" height="100" rx="9" ry="9" style="stroke: rgb(9%,20%,30%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(96%,97%,98%); fill-rule: evenodd;"/>
			<text x="90" y="596" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,1192) scale(1,-1)">queued</text>
			<text x="90" y="575" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1150) scale(1,-1)">requestKey unique</text>
			<text x="90" y="554" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1108) scale(1,-1)">Queue admission transaction</text>
			<rect x="590" y="520" width="330" height="100" rx="9" ry="9" style="stroke: rgb(9%,20%,30%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(96%,97%,98%); fill-rule: evenodd;"/>
			<text x="600" y="596" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,1192) scale(1,-1)">running</text>
			<text x="600" y="575" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1150) scale(1,-1)">One global model worker</text>
			<text x="600" y="554" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,1108) scale(1,-1)">No open DB inference transaction</text>
