			<rect x="590" y="210" width="330" height="110" rx="9" ry="9" style="stroke: rgb(9%,20%,30%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(96%,97%,98%); fill-rule: evenodd;"/>
			<text x="600" y="296" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,592) scale(1,-1)">done</text>
