			<path d="M 500,250 L 410,250 Z" style="stroke: rgb(70%,23%,23%); stroke-linecap: butt; stroke-width: 1.6;"/>
			<polygon points="410 250, 420 246, 420 254" style="stroke: rgb(70%,23%,23%); stroke-linecap: butt; stroke-width: 1; fill: rgb(70%,23%,23%); fill-rule: evenodd;"/>
			<text x="508.0" y="404.0" style="font-family: Helvetica; font-size: 14px;fill: rgb(70%,23%,23%); stroke:none;" transform="translate(0,808) scale(1,-1)">error / cancel / stale</text>
			<text x="80" y="85" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,170) scale(1,-1)">On restart: any queued/running job becomes failed/INTERRUPTED; saved notes remain intact.</text>
