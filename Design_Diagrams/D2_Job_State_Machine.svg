			<text x="600" y="254" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,508) scale(1,-1)">Atomic final publication</text>
			<text x="600" y="233" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,466) scale(1,-1)">Read-only terminal outcome</text>
			<path d="M 755,520 L 755,320 Z" style="stroke: rgb(9%,20%,30%); stroke-linecap: butt; stroke-width: 1.6;"/>
			<polygon points="755 320, 759 330, 751 330" style="stroke: rgb(9%,20%,30%); stroke-linecap: butt; stroke-width: 1; fill: rgb(9%,20%,30%); fill-rule: evenodd;"/>
			<text x="763.0" y="429.0" style="font-family: Helvetica; font-size: 14px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,858) scale(1,-1)">valid + current + not cancelled</text>
			<rect x="80" y="165" width="330" height="155" rx="9" ry="9" style="stroke: rgb(70%,23%,23%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(100%,94%,94%); fill-rule: evenodd;"/>
			<text x="90" y="296" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,20%,30%); stroke:none;" transform="translate(0,592) scale(1,-1)">failed</text>
			<text x="90" y="275" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,550) scale(1,-1)">CANCELLED / INTERRUPTED</text>
			<text x="90" y="254" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,508) scale(1,-1)">TIMEOUT / MODEL_UNAVAILABLE</text>
			<text x="90" y="233" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,466) scale(1,-1)">STALE_LIBRARY / SETTINGS_CHANGED</text>
			<text x="90" y="212" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,424) scale(1,-1)">NO_SUPPORTED_ITEMS / storage error</text>
			<text x="90" y="191" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,0%,0%); stroke:none;" transform="translate(0,382) scale(1,-1)">Correct cause; submit a new job</text>
