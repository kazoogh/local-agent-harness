<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785"><rect width="100%" height="100%" fill="white"/><text x="10" y="23" font-family="Arial" font-size="20">Local Study Assistant - D1 data model</text><text x="10" y="50" font-family="Arial" font-size="15">Goal: Help students keep notes and make study materials on their own computer for free.</text><text x="10" y="78" font-family="Arial" font-size="14">Boxes = entities. Lines = relationships, not data flow. PK = primary key; FK = foreign key. End labels: 1 = exactly one, 0..1 = optional one, 0..* = zero or more.</text><text x="10" y="95" font-family="Arial" font-size="14">Compound keys use +.</text><polyline points="370,215 290,215" fill="none" stroke="black"/><rect x="350" y="191" width="44" height="18" fill="white"/><text x="352" y="205" font-family="Arial" font-size="14">1</text><rect x="293" y="221" width="44" height="18" fill="white"/><text x="295" y="235" font-family="Arial" font-size="14">0..*</text><polyline points="630,215 715,215" fill="none" stroke="black"/><rect x="636" y="191" width="44" height="18" fill="white"/><text x="638" y="205" font-family="Arial" font-size="14">1</text><rect x="667" y="221" width="44" height="18" fill="white"/><text x="669" y="235" font-family="Arial" font-size="14">0..*</text><polyline points="500,280 500,325 675,325 675,435 715,435" fill="none" stroke="black"/><rect x="506" y="288" width="44" height="18" fill="white"/><text x="508" y="302" font-family="Arial" font-size="14">1</text><rect x="667" y="441" width="44" height="18" fill="white"/><text x="669" y="455" font-family="Arial" font-size="14">0..*</text><polyline points="845,280 845,385" fill="none" stroke="black"/><rect x="851" y="288" width="44" height="18" fill="white"/><text x="853" y="302" font-family="Arial" font-size="14">0..1</text><rect x="851" y="358" width="44" height="18" fill="white"/><text x="853" y="372" font-family="Arial" font-size="14">0..*</text><polyline points="157,280 157,385" fill="none" stroke="black"/><rect x="163" y="288" width="44" height="18" fill="white"/><text x="165" y="302" font-family="Arial" font-size="14">1</text><rect x="163" y="358" width="44" height="18" fill="white"/><text x="165" y="372" font-family="Arial" font-size="14">0..*</text><polyline points="290,450 370,450" fill="none" stroke="black"/><rect x="296" y="426" width="44" height="18" fill="white"/><text x="298" y="440" font-family="Arial" font-size="14">1</text><rect x="322" y="456" width="44" height="18" fill="white"/><text x="324" y="470" font-family="Arial" font-size="14">0..*</text><polyline points="845,515 845,620" fill="none" stroke="black"/><rect x="851" y="523" width="44" height="18" fill="white"/><text x="853" y="537" font-family="Arial" font-size="14">1</text><rect x="851" y="593" width="44" height="18" fill="white"/><text x="853" y="607" font-family="Arial" font-size="14">0..*</text><polyline points="715,685 630,685" fill="none" stroke="black"/><rect x="695" y="661" width="44" height="18" fill="white"/><text x="697" y="675" font-family="Arial" font-size="14">1</text><rect x="633" y="691" width="44" height="18" fill="white"/><text x="635" y="705" font-family="Arial" font-size="14">0..*</text><polyline points="715,650 665,650 665,490 630,490" fill="none" stroke="black"/><rect x="695" y="626" width="44" height="18" fill="white"/><text x="697" y="640" font-family="Arial" font-size="14">1</text><rect x="633" y="496" width="44" height="18" fill="white"/><text x="635" y="510" font-family="Arial" font-size="14">0..*</text><rect x="25" y="150" width="265" height="130" fill="white" stroke="black"/><text x="33" y="173" font-family="Arial" font-size="15">StudyJob</text><text x="33" y="193" font-family="Arial" font-size="15">PK id; FK courseId</text><text x="33" y="213" font-family="Arial" font-size="15">kind, state, libraryRevision</text><text x="33" y="233" font-family="Arial" font-size="15">createdAt; modelDigests</text><rect x="370" y="150" width="260" height="130" fill="white" stroke="black"/><text x="378" y="173" font-family="Arial" font-size="15">Course</text><text x="378" y="193" font-family="Arial" font-size="15">PK id; name; timeZone</text><text x="378" y="213" font-family="Arial" font-size="15">libraryRevision</text><text x="378" y="233" font-family="Arial" font-size="15">meetingRules (D2 detail)</text><rect x="715" y="150" width="260" height="130" fill="white" stroke="black"/><text x="723" y="173" font-family="Arial" font-size="15">ClassSession</text><text x="723" y="193" font-family="Arial" font-size="15">PK id; FK courseId</text><text x="723" y="213" font-family="Arial" font-size="15">date; startsAt; endsAt</text><rect x="25" y="385" width="265" height="130" fill="white" stroke="black"/><text x="33" y="408" font-family="Arial" font-size="15">StudyItem</text><text x="33" y="428" font-family="Arial" font-size="15">PK id; FK jobId</text><text x="33" y="448" font-family="Arial" font-size="15">kind; question; answer</text><text x="33" y="468" font-family="Arial" font-size="15">status (draft / active)</text><rect x="370" y="385" width="260" height="130" fill="white" stroke="black"/><text x="378" y="408" font-family="Arial" font-size="15">Citation</text><text x="378" y="428" font-family="Arial" font-size="15">PK FK itemId + FK passageId</text><text x="378" y="448" font-family="Arial" font-size="15">+ quoteStart + quoteEnd</text><text x="378" y="468" font-family="Arial" font-size="15">quote (exact source text)</text><rect x="715" y="385" width="260" height="130" fill="white" stroke="black"/><text x="723" y="408" font-family="Arial" font-size="15">Source</text><text x="723" y="428" font-family="Arial" font-size="15">PK id; FK courseId</text><text x="723" y="448" font-family="Arial" font-size="15">FK sessionId (nullable)</text><text x="723" y="468" font-family="Arial" font-size="15">kind; contentHash; originalRef</text><text x="723" y="488" font-family="Arial" font-size="15">logicalId; isCurrent</text><rect x="370" y="620" width="260" height="130" fill="white" stroke="black"/><text x="378" y="643" font-family="Arial" font-size="15">Embedding</text><text x="378" y="663" font-family="Arial" font-size="15">PK FK passageId + modelDigest</text><text x="378" y="683" font-family="Arial" font-size="15">dimension; vector (float32)</text><text x="378" y="703" font-family="Arial" font-size="15">normalized; ready</text><rect x="715" y="620" width="260" height="130" fill="white" stroke="black"/><text x="723" y="643" font-family="Arial" font-size="15">Passage</text><text x="723" y="663" font-family="Arial" font-size="15">PK id; FK sourceId</text><text x="723" y="683" font-family="Arial" font-size="15">ordinal; text; location</text><text x="723" y="703" font-family="Arial" font-size="15">startOffset; endOffset</text></svg>