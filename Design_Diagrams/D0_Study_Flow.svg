<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="10" y="25" font-family="Arial" font-size="20">Local Study Assistant - D0 Study Flow</text><text x="10" y="52" font-family="Arial" font-size="15">Goal: Help students keep notes and make study materials on their own computer for free.</text><text x="10" y="80" font-family="Arial" font-size="13">Solid boxes: app parts. Dashed box: separate software. Arrows label requests and results (-&gt;). I5 also saves indexing results. Accepted drafts save through I4 in the first</text><text x="10" y="96" font-family="Arial" font-size="13">flow.</text><polyline points="230,162 390,162" fill="none" stroke="black" marker-end="url(#a)"/><text x="238" y="140" font-family="Arial" font-size="14">I3: course ID + study</text><text x="238" y="155" font-family="Arial" font-size="14">kind</text><polyline points="610,162 770,162" fill="none" stroke="black" marker-end="url(#a)"/><text x="618" y="140" font-family="Arial" font-size="14">I5: index/search -&gt;</text><text x="618" y="155" font-family="Arial" font-size="14">passages</text><polyline points="500,195 500,325" fill="none" stroke="black" marker-end="url(#a)"/><text x="515" y="245" font-family="Arial" font-size="14">I6: text -&gt; vectors / drafts</text><polyline points="610,357 770,357" fill="none" stroke="black" marker-end="url(#a)"/><text x="618" y="335" font-family="Arial" font-size="14">I7: JSON -&gt; text /</text><text x="618" y="350" font-family="Arial" font-size="14">vectors</text><polyline points="390,180 300,180 300,255 120,255 120,195" fill="none" stroke="black" marker-end="url(#a)"/><text x="15" y="235" font-family="Arial" font-size="14">I3: checked drafts + references</text><polyline points="120,195 120,325" fill="none" stroke="black" marker-end="url(#a)"/><text x="135" y="285" font-family="Arial" font-size="14">I1: review view + status</text><rect x="10" y="130" width="220" height="65" fill="white" stroke="black"/><text x="120.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Course workspace</text><text x="120.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Choose a course tool</text><rect x="390" y="130" width="220" height="65" fill="white" stroke="black"/><text x="500.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Study engine</text><text x="500.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Index / retrieve / draft</text><rect x="770" y="130" width="220" height="65" fill="white" stroke="black"/><text x="880.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Local data store</text><text x="880.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Course text + search index</text><rect x="390" y="325" width="220" height="65" fill="white" stroke="black"/><text x="500.0" y="351" text-anchor="middle" font-family="Arial" font-size="17">Ollama connection</text><text x="500.0" y="372" text-anchor="middle" font-family="Arial" font-size="17">Local request / response</text><rect x="770" y="325" width="220" height="65" fill="white" stroke="black" stroke-dasharray="5,4"/><text x="880.0" y="351" text-anchor="middle" font-family="Arial" font-size="17">Ollama + local models</text><text x="880.0" y="372" text-anchor="middle" font-family="Arial" font-size="17">Text / search vectors</text><rect x="10" y="325" width="220" height="65" fill="white" stroke="black"/><text x="120.0" y="351" text-anchor="middle" font-family="Arial" font-size="17">Desktop interface</text><text x="120.0" y="372" text-anchor="middle" font-family="Arial" font-size="17">Review / accept / practice</text></svg>