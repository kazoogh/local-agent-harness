<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="10" y="25" font-family="Arial" font-size="20">Local Study Assistant - D0 Capture Flow</text><text x="10" y="52" font-family="Arial" font-size="15">Goal: Help students keep notes and make study materials on their own computer for free.</text><text x="10" y="80" font-family="Arial" font-size="13">Solid boxes: parts of my app. Arrows: the data being passed. I1 also returns save status. Files go through the importer; notes go straight to storage.</text><polyline points="230,162 390,162" fill="none" stroke="black" marker-end="url(#a)"/><text x="238" y="140" font-family="Arial" font-size="14">I1: note / file + meeting</text><text x="238" y="155" font-family="Arial" font-size="14">ID</text><polyline points="610,162 770,162" fill="none" stroke="black" marker-end="url(#a)"/><text x="618" y="140" font-family="Arial" font-size="14">I2: file bytes + media</text><text x="618" y="155" font-family="Arial" font-size="14">type</text><polyline points="880,195 880,250 500,250 500,195" fill="none" stroke="black" marker-end="url(#a)"/><text x="640" y="235" font-family="Arial" font-size="14">I2: text spans + page IDs</text><polyline points="500,195 500,300" fill="none" stroke="black" marker-end="url(#a)"/><text x="515" y="288" font-family="Arial" font-size="14">I4: dated course records</text><rect x="10" y="130" width="220" height="65" fill="white" stroke="black"/><text x="120.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Desktop interface</text><text x="120.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Select course / capture</text><rect x="390" y="130" width="220" height="65" fill="white" stroke="black"/><text x="500.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Course workspace</text><text x="500.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Check course and input</text><rect x="770" y="130" width="220" height="65" fill="white" stroke="black"/><text x="880.0" y="156" text-anchor="middle" font-family="Arial" font-size="17">Material importer</text><text x="880.0" y="177" text-anchor="middle" font-family="Arial" font-size="17">Extract readable content</text><rect x="390" y="300" width="220" height="65" fill="white" stroke="black"/><text x="500.0" y="326" text-anchor="middle" font-family="Arial" font-size="17">Local data store</text><text x="500.0" y="347" text-anchor="middle" font-family="Arial" font-size="17">Save course records</text></svg>